name: Sync web ? app

on:
  push:
    branches: [web]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout app branch
        uses: actions/checkout@v4
        with:
          ref: app
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge web into app
        run: |
          git fetch origin web

          # Merge web into app without committing yet
          git merge origin/web --no-commit --no-ff || true

          # Restore app-specific files so they never get overwritten.
          # CHANGELOG.md/README.md intentionally differ per branch (web's
          # README is a scoped-down variant, CHANGELOG.md doesn't exist on
          # web at all) — merging them caused real conflicts (2026-08-17).
          git checkout HEAD -- electron/ package.json vite.config.ts .github/ CHANGELOG.md README.md

          # Only push if there are actual changes
          if git diff --cached --quiet; then
            echo "Already up to date � nothing to sync."
          else
            git commit -m "chore: sync from web [skip ci]"
            git push origin app
          fi
